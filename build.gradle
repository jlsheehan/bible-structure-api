plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.palantir.git-version' version '0.12.3'
}

group 'bible'
version gitVersion()
versionDetails = versionDetails()

jar {
    manifest {
        attributes 'Implementation-Title': 'Bible Structure API',
                    'Implementation-Version': version,
                    'Specification-Title': 'bible.bible-structure-api',
                    'Specification-Version': versionDetails.lastTag
    }
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "sftp://192.168.1.14:22/srv/repository"
            credentials {
                username "$repoUser"
                password "$repoPass"
            }
        }
    }
}

dependencies {
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.30'
    testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.30'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
