plugins {
    id 'java-library'
    id 'maven-publish'
    id 'org.ajoberstar.reckon' version '0.13.0'
}

group 'bible'
//version '1.0'

reckon {
    scopeFromProp()
    stageFromProp('dev', 'release')
}

jar {
    manifest {
        attributes 'Implementation-Title': 'Bible Structure API',
                    'Implementation-Version': archiveVersion,
                    'Specification-Title': 'bible.bible-structure-api',
                    'Specification-Version': '1.0'
    }
}

repositories {
    mavenCentral()
}

publishing {
    publications {
        maven(MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "sftp://192.168.1.14:22/srv/repository"
            credentials {
                username "$repoUser"
                password "$repoPass"
            }
        }
    }
}

dependencies {
    implementation group: 'org.slf4j', name: 'slf4j-api', version: '1.7.30'
    testImplementation group: 'org.slf4j', name: 'slf4j-simple', version: '1.7.30'
    testImplementation group: 'junit', name: 'junit', version: '4.12'
}
